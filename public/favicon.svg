<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <rect width="512" height="512" rx="112" fill="#030712"/>
  <defs>
    <radialGradient id="bgGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.35"/>
      <stop offset="60%" stop-color="#0066FF" stop-opacity="0.12"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    
    <!-- Upper Chevron Gradients -->
    <linearGradient id="topFacet" x1="160" y1="140" x2="352" y2="240" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="60%" stop-color="#0080FF"/>
      <stop offset="100%" stop-color="#0055FF"/>
    </linearGradient>
    <linearGradient id="topShadow" x1="220" y1="180" x2="330" y2="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0055D4"/>
      <stop offset="100%" stop-color="#001845"/>
    </linearGradient>

    <!-- Lower Chevron Gradients -->
    <linearGradient id="bottomFacet" x1="352" y1="372" x2="160" y2="272" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00F0FF"/>
      <stop offset="50%" stop-color="#0077FF"/>
      <stop offset="100%" stop-color="#0044DD"/>
    </linearGradient>
    <linearGradient id="bottomShadow" x1="292" y1="332" x2="182" y2="242" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#0055D4"/>
      <stop offset="100%" stop-color="#001438"/>
    </linearGradient>

    <!-- Specular Highlight Line -->
    <linearGradient id="neonGlint" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00F0FF" stop-opacity="0.4"/>
    </linearGradient>
    
    <filter id="neonDrop" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="0" stdDeviation="12" flood-color="#00F0FF" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Ambient Glow -->
  <circle cx="256" cy="256" r="220" fill="url(#bgGlow)"/>

  <g filter="url(#neonDrop)">
    <!-- UPPER HALF OF Z EMBLEM -->
    <!-- Main top facet -->
    <path d="M 152 208 L 240 128 C 248 120 264 120 272 128 L 348 196 C 356 204 354 218 344 226 L 298 266 L 254 226 L 314 178 L 256 142 L 176 216 Z" fill="url(#topFacet)"/>
    <!-- Top inner arrow fold -->
    <path d="M 298 266 L 254 226 L 244 236 L 256 264 C 262 278 274 286 288 284 Z" fill="url(#topShadow)"/>
    
    <!-- LOWER HALF OF Z EMBLEM -->
    <!-- Main bottom facet -->
    <path d="M 360 304 L 272 384 C 264 392 248 392 240 384 L 164 316 C 156 308 158 294 168 286 L 214 246 L 258 286 L 198 334 L 256 370 L 336 296 Z" fill="url(#bottomFacet)"/>
    <!-- Bottom inner arrow fold -->
    <path d="M 214 246 L 258 286 L 268 276 L 256 248 C 250 234 238 226 224 228 Z" fill="url(#bottomShadow)"/>

    <!-- Sharp ridge highlights -->
    <path d="M 240 128 L 272 128 L 348 196" stroke="url(#neonGlint)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 272 384 L 240 384 L 164 316" stroke="url(#neonGlint)" stroke-width="4" stroke-linecap="round"/>
    <path d="M 176 216 L 256 142 L 314 178" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.8"/>
    <path d="M 336 296 L 256 370 L 198 334" stroke="#00F0FF" stroke-width="2" stroke-opacity="0.8"/>
  </g>
</svg>
